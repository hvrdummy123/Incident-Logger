services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traceiq
      POSTGRES_PASSWORD: traceiq
      POSTGRES_DB: traceiq
    ports:
      # Host 55432 — 5432 is Homebrew Postgres; 5433 is another local compose stack.
      - "55432:5432"
    volumes:
      - traceiq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceiq -d traceiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api / worker / web arrive in M8–M10; Postgres alone unblocks M1 tests.

volumes:
  traceiq_pg:
