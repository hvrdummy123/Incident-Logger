[project]
name = "traceiq-incident"
version = "0.1.0"
description = "TraceIQ — incident root-cause analysis agent with cited evidence"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "TraceIQ contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "duckdb>=1.1.0",
  "pyarrow>=18.0.0",
  "orjson>=3.10.0",
  "httpx>=0.28.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "argon2-cffi>=23.1.0",
  "PyJWT[crypto]>=2.10.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "prometheus-client>=0.21.0",
  "python-multipart>=0.0.17",
  "ulid-py>=1.1.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-xdist>=3.6.0",
  "pytest-cov>=6.0.0",
  "hypothesis>=6.119.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "bandit>=1.8.0",
  "pip-audit>=2.7.0",
  "types-PyYAML>=6.0.0",
]

[project.scripts]
traceiq = "traceiq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceiq"]

# Project name is traceiq-incident (PyPI); import package is traceiq.
[tool.hatch.build.targets.wheel.sources]
"src/traceiq" = "traceiq"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/traceiq/db/migrations/versions/*" = ["E501", "I001"]
"src/traceiq/db/models.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["traceiq"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "perf: performance benchmarks",
  "chaos: chaos / durability tests",
  "postgres: requires a live Postgres",
]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
